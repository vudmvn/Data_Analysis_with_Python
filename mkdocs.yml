site_name: "DSAI1005 – Phân tích dữ liệu với Python"
site_description: "Giáo trình & Bài giảng môn Phân tích dữ liệu với Python - Khoa KHDL & TTNT, NEU"
site_author: "TS. Vũ Đức Minh"
site_url: "https://vudmvn.github.io/Data_Analysis_with_Python/"
repo_url: "https://github.com/vudmvn/Data_Analysis_with_Python"
repo_name: "vudmvn/Data_Analysis_with_Python"

theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Trang chủ: index.md
  - Đề cương học phần: syllabus-vn.md
  - Quy trình soạn bài giảng: QUY_TRINH_SOAN_BAI_GIANG.md
  - English README: README-en.md
  - Tuần 01 - Giới thiệu học phần:
      - Tổng quan tuần 1: lectures/week-01-gioi-thieu-hoc-phan/README.md
      - Sáu bước trong quy trình PTDL: lectures/week-01-gioi-thieu-hoc-phan/cac_buoc_cua_phan_tich_du_lieu.md
      - Khám phá tương quan: lectures/week-01-gioi-thieu-hoc-phan/kham_pha_tuong_quan.md
      - Phân tích dữ liệu khám phá (EDA): lectures/week-01-gioi-thieu-hoc-phan/phan_tich_du_lieu_kham_pha.md
      - Phân tích dữ liệu là gì: lectures/week-01-gioi-thieu-hoc-phan/phan_tich_du_lieu_la_gi.md
      - Phân tích thống kê là gì: lectures/week-01-gioi-thieu-hoc-phan/phan_tich_thong_ke.md
      - Slide tổng quan: lectures/week-01-gioi-thieu-hoc-phan/slides.md
